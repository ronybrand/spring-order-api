server:
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

spring:
  application:
    name: spring-order-api
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:orderapi}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8085/realms/orderapi}

app:
  security:
    oauth2:
      expected-audience: ${OAUTH2_EXPECTED_AUDIENCE:order-api}
    max-request-size-bytes: 1048576
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    rate-limit:
      max-requests-per-window: 120
      window-seconds: 60

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
