server:
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

spring:
  application:
    name: spring-order-api
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:orderapi}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8085/realms/orderapi}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:orderapi_view}
      uuid-representation: standard
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  pagination:
    default-page: 0
    default-size: 20
    max-size: 100
  security:
    oauth2:
      expected-audience: ${OAUTH2_EXPECTED_AUDIENCE:order-api}
    max-request-size-bytes: 1048576
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    rate-limit:
      max-requests-per-window: 120
      window-seconds: 60
      trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  notification:
    from-address: ${NOTIFICATION_FROM_ADDRESS:no-reply@order-api.dev}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
