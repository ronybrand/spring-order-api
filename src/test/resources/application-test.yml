# Overrides only what's needed so the test suite doesn't self-throttle - never disables the
# production guards (rate limit, CORS), only adjusts the parameters because the whole suite hits
# the same address/origin, unlike the distributed traffic these guards are meant to contain.
app:
  security:
    cors:
      allowed-origins: http://localhost:3000
    rate-limit:
      max-requests-per-window: 100000
      window-seconds: 60

spring:
  rabbitmq:
    listener:
      simple:
        # No RabbitMQ broker is guaranteed to be running for every *IT execution (e.g. CI); the
        # consumer side (retry/DLQ contract) is covered by OrderNotificationRabbitListenerTest
        # instead, which needs no broker. The producer side (OrderStatusEventListener) still
        # attempts to publish and simply logs a warning if unreachable - see its try/catch.
        auto-startup: false
