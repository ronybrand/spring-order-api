# Overrides only what's needed so the test suite doesn't self-throttle - never disables the
# production guards (rate limit, CORS), only adjusts the parameters because the whole suite hits
# the same address/origin, unlike the distributed traffic these guards are meant to contain.
app:
  security:
    cors:
      allowed-origins: http://localhost:3000
    rate-limit:
      max-requests-per-window: 100000
      window-seconds: 60

spring:
  rabbitmq:
    listener:
      simple:
        # Consumers don't auto-start for every *IT by default - most don't need a live consumer
        # (the retry/DLQ contract itself is covered by each listener's own *Test with a mocked
        # dependency, no broker needed) and letting them race against test setup would be
        # non-deterministic. Tests that specifically exercise the real broker (e.g. RabbitMQ DLQ
        # coverage, OutboxPublisher) start their own container/listener explicitly.
        auto-startup: false
