<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spring-order-api - API docs</title>
    <!--
      Static snapshot of the OpenAPI spec, generated by OpenApiSpecExportIT
      during `mvn verify` (real Spring context, Testcontainers-backed) and
      published here by the `pages` CI job on every push to main. There is no
      live instance of this API to browse /swagger-ui.html on - springdoc
      stays disabled outside the dev profile in every real deployment (see
      SwaggerDisabledByDefaultTest) - so this is a build-time snapshot, not a
      live docs server.
    -->
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <redoc spec-url="./openapi.json"></redoc>
    <script src="https://cdn.redocly.com/redoc/latest/bundles/redoc.standalone.js"></script>
  </body>
</html>
