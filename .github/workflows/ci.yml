name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # mvn verify runs unit tests, *IT (Testcontainers spins up Postgres via Docker, available
      # natively on GitHub-hosted Linux runners), the JaCoCo coverage gate
      # (80% line / 65% branch minimum) and PMD (hard-fail on violation).
      - run: ./mvnw -B verify
