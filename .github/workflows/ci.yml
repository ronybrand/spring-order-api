name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless; a run on main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # mvn verify runs unit tests (including the Pact JVM consumer/provider message-contract
      # pair for the notification queue), *IT (Testcontainers spins up Postgres via Docker,
      # available natively on GitHub-hosted Linux runners), the JaCoCo coverage gate
      # (80% line / 65% branch minimum) and PMD (hard-fail on violation).
      #
      # OpenApiSpecExportIT (one of the *IT tests above) also drops a snapshot of the OpenAPI
      # spec at target/openapi/openapi.json, hitting /v3/api-docs on the same full context/
      # Testcontainers already up for the rest of the suite - no live deployment of this app
      # exists to browse Swagger on (springdoc stays disabled outside the dev profile - see
      # SwaggerDisabledByDefaultTest), so this build-time snapshot is what the `pages` job below
      # publishes.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi-spec
          path: target/openapi/openapi.json
          if-no-files-found: error
          retention-days: 7

  # Builds the image on every pull request and push (it validates that the Dockerfile still
  # produces a working image) but never pushes it. It does not wait for `verify`: the build does
  # not use anything `verify` produces, so the two run side by side and the pipeline lasts as long
  # as the slower one instead of their sum. It also warms the layer cache that `docker-publish`
  # below reuses.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # Loaded into the local daemon (not pushed) so Trivy can scan it below.
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # HIGH/CRITICAL findings with a fix available fail the job; unfixed ones are noise nobody
      # can act on yet. Scans the OS packages and the libraries inside the jar.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Push to GHCR only from main, where GITHUB_TOKEN has package-write on this repo by default (a
  # fork's PR run gets a read-only token, so pushing there would just fail, not add security
  # value), and only after BOTH the tests and the image build passed: nothing broken is published.
  # Every layer comes from the cache `docker-build` just wrote, so this is the push, not a rebuild.
  docker-publish:
    needs: [verify, docker-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha

  # Publishes a static snapshot of the OpenAPI spec (see the comment on `verify` above) as a
  # Redoc page - the only way to see the API's shape without cloning the repo and running
  # `docker compose up`. Push-only (a fork's PR run has no Pages write access, and a preview
  # per-PR isn't worth the extra complexity for a docs page). The `github-pages` environment
  # name/permissions here are GitHub's own required contract for actions/deploy-pages, unrelated
  # to (and unaffected by) the AWS-OIDC `environment:` issue hit on the angular_estado deploy.
  pages:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: openapi-spec
          path: site
      - run: cp docs/api-docs/index.html site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
