name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # mvn verify roda unit tests, *IT (Testcontainers sobe Postgres via Docker, disponivel
      # nativamente nos runners Linux hospedados do GitHub), o gate de cobertura do JaCoCo
      # (linha 80% / branch 65% minimo) e o PMD (hard-fail em violação).
      - run: ./mvnw -B verify
