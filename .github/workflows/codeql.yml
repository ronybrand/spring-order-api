name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: java-kotlin
          # Declaring "manual" (we build with Maven below) still prints a "Cannot build an
          # overlay database ... instead of 'none'" fallback warning every run - overlay analysis
          # only activates for build-mode "none", which isn't a fit here since Lombok's
          # annotation-processing-generated code needs an actual compile to be extracted
          # accurately. Harmless; not fixable without giving up build-mode: manual.
          build-mode: manual
      # CodeQL para Java precisa observar a build para resolver o classpath/bytecode -
      # skip de testes para o scan ser mais rapido, sem afetar a analise estatica.
      - run: ./mvnw -B -DskipTests package
      - uses: github/codeql-action/analyze@v4.37.9
