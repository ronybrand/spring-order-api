name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          # Declaring "manual" (we build with Maven below) still prints a "Cannot build an
          # overlay database ... instead of 'none'" fallback warning every run - overlay analysis
          # only activates for build-mode "none", which isn't a fit here since Lombok's
          # annotation-processing-generated code needs an actual compile to be extracted
          # accurately. Harmless; not fixable without giving up build-mode: manual.
          build-mode: manual
      # CodeQL para Java precisa observar a build para resolver o classpath/bytecode -
      # skip de testes para o scan ser mais rapido, sem afetar a analise estatica.
      - run: ./mvnw -B -DskipTests package
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
